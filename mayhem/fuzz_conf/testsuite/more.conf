Upstream socks5 127.0.0.1:1080
Upstream socks4 h:1 "example.com"
FilterURLs On
FilterExtended On
FilterCaseSensitive Yes
FilterDefaultDeny Yes
FilterType fnmatch
Filter "/nonexistent"
XTinyproxy Yes
Bind 127.0.0.1
BindSame Yes
Deny 192.168.0.0/16
ErrorFile 404 "/x"
DefaultErrorFile "/y"
MaxRequestsPerChild 10
MinSpareServers 1
MaxSpareServers 2
StartServers 1
User nobody
Group nogroup
Syslog On
PidFile "/p"
LogFile "/l"
DisableViaHeader No
# comment

